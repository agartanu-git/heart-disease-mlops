name: MLOps CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-test-train:
    name: Lint, Test & Train
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src tests scripts

      - name: Check formatting with black
        run: |
          black --check src tests scripts

      - name: Download dataset
        run: python scripts/download_data.py

      - name: Run unit tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term

      - name: Train model
        run: python -m src.train

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/model.joblib
            models/metrics.json

      - name: Upload EDA & training figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: reports/figures/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-test-train
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: heart-disease-api:ci
          load: true

      - name: Smoke test container
        run: |
          docker run -d --name heart-api -p 8000:8000 heart-disease-api:ci
          sleep 10
          curl -sf http://localhost:8000/health || (docker logs heart-api && exit 1)
          docker rm -f heart-api
